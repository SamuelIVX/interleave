name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Build and Test
        run: ./gradlew build --no-daemon

  mutation:
    name: Mutation (scoped)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Run PIT (scoped)
        run: ./gradlew pitest --console=plain --no-daemon

      # Explicit, and `if: always()`, because `pitest.finalizedBy(mutationRatchet)` does NOT
      # run when PIT itself fails the threshold — Gradle stops the build first. That is the one
      # path where the breakdown is most wanted: PIT's own message says only "score 95 below
      # threshold 96" and cannot distinguish a real regression from a rounding artefact. The
      # ratchet prints the status census and names the failure. `-x pitest` keeps this from
      # re-running a 3-minute analysis; the report already exists from the step above.
      #
      # Skips when there is no report. If PIT died before writing one — a compile error, an OOM
      # kill — the ratchet has nothing to read and would otherwise fail with "no mutation
      # report", burying the real cause under a misleading error. The job still fails: this
      # step's exit status cannot mask the PIT step's.
      - name: Mutation ratchet
        if: always()
        run: |
          if [ -f build/reports/pitest/mutations.xml ]; then
            ./gradlew mutationRatchet -x pitest --console=plain --no-daemon
          else
            echo "::notice::No PIT report was produced, so there is nothing to ratchet. Skipping."
          fi

      - name: Upload report
        # if: always() so a ratchet failure still publishes the HTML that explains it.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitest-report
          path: build/reports/pitest/
          if-no-files-found: error
