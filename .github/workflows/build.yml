name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visualizer:
    name: Visualizer compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check visualizer verdict compatibility
        run: node docs/visualizer-normalize-check.mjs

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Build and Test
        run: ./gradlew build --no-daemon

  mutation:
    # Was named "Mutation (scoped)", which was never true: this job passes no
    # -PpitestTargetOverride, so `./gradlew pitest` runs the full default scope. Verified from
    # this job's own log at d14680d — 270 mutants, 256/270, not the 97 a BitstateStore scope
    # produces. Renamed because 12.06 turns this job into the real full-scope gate, and a
    # reviewer reading the checks list would otherwise assume the gate covers one class.
    # Not a required status check (main has no branch protection), so renaming breaks nothing.
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Run PIT (full scope)
        run: ./gradlew pitest --console=plain --no-daemon

      # Narrower than it looks, and it does NOT suppress the ratchet's own missing-report
      # error. `pitest.finalizedBy(mutationRatchet)` runs the ratchet even when PIT dies
      # before writing any report (verified with a marker finalizer on the real task), so in
      # that case the finalizer prints "no mutation report" regardless of what this step does.
      # That error is secondary: the PIT step's own failure comes first in the log and is the
      # cause. This step's skip avoids a redundant SECOND invocation of the ratchet, nothing
      # more — the misleading error still appears, it just appears once.
      #
      # `-x pitest` keeps this from re-running a ~3-minute analysis; when a report does exist
      # it is the one the step above just produced.
      - name: Mutation ratchet
        if: always()
        run: |
          if [ -f build/reports/pitest/mutations.xml ]; then
            ./gradlew mutationRatchet -x pitest --console=plain --no-daemon
          else
            echo "::notice::No PIT report was produced. The Gradle finalizer has already"
            echo "::notice::reported this; skipping to avoid saying it twice."
          fi

      - name: Upload report
        # if: always() so a ratchet failure still publishes the HTML that explains it.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitest-report
          path: build/reports/pitest/
          if-no-files-found: error
