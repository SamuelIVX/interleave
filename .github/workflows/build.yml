name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Build and Test
        run: ./gradlew build --no-daemon

  mutation:
    name: Mutation (scoped)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Run PIT (scoped)
        run: ./gradlew pitest --console=plain --no-daemon

      # Narrower than it looks. `pitest.finalizedBy(mutationRatchet)` DOES run the ratchet
      # when PIT fails its threshold — Gradle schedules finalizers on failure, and this was
      # verified with a marker finalizer on the real task. So this step is not here to cover
      # the threshold-failure path; it is here for the path where PIT dies before writing any
      # report at all (compile error, OOM kill). There the ratchet has nothing to read and would
      # fail with a misleading "no mutation report", burying the real cause. Skipping instead
      # leaves the PIT step's own failure as the visible reason. The job still fails.
      #
      # `-x pitest` keeps this from re-running a ~3-minute analysis; when a report does exist
      # it is the one the step above just produced.
      - name: Mutation ratchet
        if: always()
        run: |
          if [ -f build/reports/pitest/mutations.xml ]; then
            ./gradlew mutationRatchet -x pitest --console=plain --no-daemon
          else
            echo "::notice::No PIT report was produced, so there is nothing to ratchet. Skipping."
          fi

      - name: Upload report
        # if: always() so a ratchet failure still publishes the HTML that explains it.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitest-report
          path: build/reports/pitest/
          if-no-files-found: error
